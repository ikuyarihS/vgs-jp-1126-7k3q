<script>
const A=JSON.parse(document.getElementById('agenda-data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const at=(d,t)=>new Date(d+'T'+t+':00'+A.offset);
const dm=d=>d.slice(8)+'/'+d.slice(5,7);
const dow=d=>DOW[at(d,'12:00').getUTCDay()];
const fmt=(z,n)=>new Intl.DateTimeFormat('en-GB',Object.assign({hour:'2-digit',minute:'2-digit',hour12:false},z?{timeZone:z}:{})).format(n);
const dayOf=n=>new Intl.DateTimeFormat('sv-SE',{timeZone:A.tz}).format(n);
const LOCALTZ=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
// Each item gets s (start) and e (end) as instants; e for an open end is the next later start that day, else 23:59 that day.
const IT=A.items.map((x,i)=>Object.assign({i},x));
IT.forEach(x=>{if(!x.start)return;x.s=at(x.day,x.start);
 if(x.end){x.e=at(x.day,x.end);if(+x.e===+x.s)x.e=new Date(+x.s+6e4);return}
 const later=IT.filter(y=>y.start&&y.day===x.day&&at(y.day,y.start)>x.s).map(y=>+at(y.day,y.start));
 x.e=new Date(later.length?Math.min(...later):+at(x.day,'23:59')+6e4);x.open=true});
const days=[...new Set(IT.map(x=>x.day))];
const timed=IT.filter(x=>x.s);
const endAll=new Date(Math.max(...IT.map(x=>x.e?+x.e:+at(x.day,'23:59')+6e4)));
function left(ms){const m=Math.max(0,Math.ceil(ms/6e4));if(m<1)return'sắp bắt đầu';const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
 return 'còn '+[d?d+' ngày':'',h?h+' giờ':'',(!d&&mm)?mm+' phút':''].filter(Boolean).join(' ')}
function state(x,n){if(!x.s){const de=+at(x.day,'23:59')+6e4;if(n>=de)return'past';return dayOf(n)===x.day?'today':'future'}
 if(n<x.s)return'future';if(n<x.e)return'now';return'past'}
// static render
document.title=A.title;$('ttl').textContent=A.title;$('sub').textContent=A.sub||'';
const back=(A.links||[]).find(l=>/github\.io/.test(l[1]));if(back)$('back').href=back[1];else $('back').hidden=true;
$('facts').innerHTML=(A.facts||[]).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
$('agenda').innerHTML=days.map(d=>`<div class="day"><h2 id="d${d}">${dow(d)} ${dm(d)}<span class="tag" hidden>Hôm nay</span></h2><ol class="items">${IT.filter(x=>x.day===d).map(x=>`<li class="it${x.hl?' hl':''}" id="i${x.i}">
 <div class="tm">${x.start?`<b>${esc(x.start)}</b>${x.end&&x.end!==x.start?`<span>đến ${esc(x.end)}</span>`:x.open?'<span>kết thúc TBC</span>':''}`:'<span class="tbc">TBC</span><span>giờ chưa chốt</span>'}</div>
 <div><h3>${esc(x.title)}${x.tag?`<span class="tag ${esc(x.tag)}">${esc(x.tag)}</span>`:''}</h3>${x.detail?`<p>${esc(x.detail)}</p>`:''}${x.where?`<p class="wh">Địa điểm: ${esc(x.where)}</p>`:''}<span class="badge"></span></div></li>`).join('')}</ol></div>`).join('');
const tel=p=>'tel:'+p.replace(/[^+\d]/g,'');
$('contacts').innerHTML=(A.contacts||[]).map(c=>`<div class="ct"><h3>${esc(c.name)}</h3><div class="rl">${esc(c.role)}</div>${c.phone||c.email?`<div class="acts">${c.phone?`<a href="${esc(tel(c.phone))}">Gọi ${esc(c.phone)}</a>`:''}${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:''}</div>`:''}${c.note?`<p>${esc(c.note)}</p>`:''}</div>`).join('');
$('links').innerHTML=(A.links||[]).map(([l,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a></li>`).join('');
$('sources').innerHTML=(A.sources||[]).map(s=>`<li>${esc(s)}</li>`).join('');
// live part
let lastKey=null;
function paint(){const n=new Date(),td=dayOf(n);
 $('ckJ').innerHTML=`${esc(A.tzLabel||A.tz)} <b>${fmt(A.tz,n)}</b> <span>${dow(td)} ${dm(td)}</span>`;
 $('ckL').innerHTML=`Giờ của bạn <b>${fmt(null,n)}</b> <span>${esc(LOCALTZ.replace(/_/g,' '))}</span>`;
 const st=IT.map(x=>state(x,n));
 const fut=timed.filter(x=>st[x.i]==='future').sort((a,b)=>a.s-b.s);
 const nx=fut.length?fut.filter(x=>+x.s===+fut[0].s):[];
 const cur=timed.filter(x=>st[x.i]==='now');
 IT.forEach(x=>{const el=$('i'+x.i),s=st[x.i],isN=nx.includes(x);
  const cls=s==='now'?'now':isN?'next':s==='past'?'past':s==='today'?'today':'';
  el.classList.remove('now','next','past','today');if(cls)el.classList.add(cls);
  const txt=s==='now'?(x.open?'Đã bắt đầu, kết thúc TBC':'Đang diễn ra'+(x.e-x.s>6e4?' - '+left(x.e-n)+' nữa xong':'')):isN?'Tiếp theo - '+left(x.s-n):s==='past'?'Đã xong':s==='today'?'Hôm nay, giờ TBC':'';
  const b=el.querySelector('.badge');if(b.textContent!==txt)b.textContent=txt;
  el.setAttribute('aria-current',s==='now'?'true':'false')});
 document.querySelectorAll('.day h2').forEach(h=>{h.querySelector('.tag').hidden=h.id!=='d'+td});
 const nxTxt=()=>nx.map(x=>x.title).join(', ')+' lúc '+nx[0].start+(nx[0].day===td?'':' '+dow(nx[0].day)+' '+dm(nx[0].day))+' ('+left(nx[0].s-n)+')';
 const tbcToday=IT.filter(x=>st[x.i]==='today');
 let T,S;
 if(n>=endAll){T='Chương trình đã kết thúc';S='Tất cả các mục đã xong. Liên hệ và tài liệu vẫn ở bên dưới.'}
 else if(cur.length){T='Đang diễn ra: '+cur.map(x=>x.title).join(', ');S=nx.length?'Tiếp theo: '+nxTxt():'Đây là mục cuối có giờ.'}
 else if(timed.length&&n<Math.min(...timed.map(x=>+x.s))){T='Bắt đầu sau '+left(nx[0].s-n).replace(/^còn /,'');S='Mục có giờ đầu tiên: '+nxTxt()+(tbcToday.length?'. Hôm nay còn: '+tbcToday.map(x=>x.title).join(', ')+' (giờ TBC).':'.')}
 else{T=nx.length?'Tiếp theo: '+nx.map(x=>x.title).join(', '):'Hôm nay '+dow(td)+' '+dm(td);S=nx.length?'Lúc '+nx[0].start+(nx[0].day===td?'':' '+dow(nx[0].day)+' '+dm(nx[0].day))+' ('+left(nx[0].s-n)+').':tbcToday.length?'Hôm nay còn: '+tbcToday.map(x=>x.title).join(', ')+' (giờ TBC).':''}
 if($('stT').textContent!==T)$('stT').textContent=T;if($('stS').textContent!==S)$('stS').textContent=S;
 // scroll the current item (else the next one) into view when it changes
 const tgt=cur[0]||nx[0]||null,key=tgt?tgt.i:'none';
 if(key!==lastKey){const first=lastKey===null;lastKey=key;if(tgt&&n<endAll&&!location.hash){const el=$('i'+tgt.i),r=el.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight)el.scrollIntoView({block:'center',behavior:first||matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}
 document.body.dataset.state=n>=endAll?'done':cur.length?'during':n<Math.min(...timed.map(x=>+x.s))?'before':'between'}
paint();setInterval(paint,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)paint()});
</script></body></html>
